<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Bar</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        }

        .download-container {
        width: 320px;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .download-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
        color: #333;
        }

        .filename {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        }

        .percentage {
        color: #666;
        }

        .progress-bar {
        width: 100%;
        height: 10px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        }

        .progress-fill {
        height: 100%;
        width: 65%; /* Change this value (0% - 100%) */
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        border-radius: 999px;
        transition: width 0.3s ease;
        }
    </style>
    </head>
    <body>

    <div class="download-container">
        <div class="download-info">
        <span class="filename">project-files.zip</span>
        <span class="percentage">65%</span>
        </div>
        <div class="progress-bar">
        <div class="progress-fill"></div>
        </div>
    </div>   

</body>
</html>
