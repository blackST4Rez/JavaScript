<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <body style="background-color: #212121; color: white;">
            XMLhttpRequest <hr>
        0	UNSENT	Client has been created. open() not called yet.<br>
        1	OPENED	open() has been called.<br>
        2	HEADERS_RECEIVED	send() has been called, and headers and status are available.<br>
        3	LOADING	Downloading; responseText holds partial data.<br>
        4	DONE	The operation is complete.<br><hr>

        <button id="pfp" >Profile</button>

        <div id="avatar">
            <!-- Github profile Will appear here -->
        </div>

    </body>

    <script>

        const getImg = function() {   

             const ava = 'https://avatars.githubusercontent.com/u/94746134?v=4'
            addImg.innerHTML = 
            `
            <h2> Your Github Avatar is </h2>
            <img src="${ava}">
            `

            console.log(`Your Github avatar is ${ava}`)
        }

        const addImg = document.getElementById('avatar');
        const changeImg = document.querySelector('#pfp').addEventListener('click',getImg);

        const requestUrl = 'https://api.github.com/users/blackST4Rez'
        const xhr = new XMLHttpRequest();
        xhr.open('GET', requestUrl)
        xhr.onreadystatechange = function(){
            console.log(xhr.readyState);
            if (xhr.readyState === 4) {
                const data = JSON.parse(this.responseText)
                console.log(typeof data);
                console.log(data.followers);
            }
        }
        xhr.send();
        
    </script>
