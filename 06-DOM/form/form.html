<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form DOM</title>
</head>

    <style>

        input{
            display: block;
            font-size: 30px;
        }

        .card{
            width: 100%;
            height: 100%;
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #222;
            display: inline-block;
        }

        .profile{
            border-radius: 50%;
            width: 80px;
            height: 80px;
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #222;
            display: inline-block;
            overflow: hidden;
            }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>

    <body>

        <div id="main">
            <form action="">
                <input type="text" placeholder="profile pic">
                <input type="text" placeholder="name">
                <input type="text" placeholder="occupation">
                <input type="text" placeholder="info">
                <input type="submit">
            </form>
        </div>

    <script src="script.js"></script>

    </body>
</html>
