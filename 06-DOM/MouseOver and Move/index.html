<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            width: 100%;
            height: 100%;
        }

        body{
            position: relative;
            overflow: hidden;
        }

        #abcd{
            position: absolute;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            background-color: aquamarine;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 0.3s;
        }
    </style>
</head>
<body>
    <div id="abcd"></div>
    <script src="script.js"></script>
</body>
</html>
