<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="moon.ico" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <title>Dark Mode</title>

        <style>

            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                font-family: 'Poppins', sans-serif;
                transition: 0.3s ease-in-out;
            }

            .text-container{
                width: 400px;
                margin: 0 auto;
                border: 1px solid #1c1c1c;
                padding: 40px;
                transition: 0.3s ease-in-out;
            }

            #dark-container{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 1rem;
                width: 100%;
                height: 100vh;
            }

            #toggle-container{
                width: max-content;
                height: max-content;
                margin: 0 auto;
                font-family: 'Poppins', sans-serif;
                border-radius: 50px;
                transition: 0.3s ease-in-out;
            }

            .saved-container{
                width: 400px;
                margin: 0 auto;
                border: 1px solid #1c1c1c;
                padding: 40px;
                transition: 0.3s ease-in-out;
            }

            h1{
                text-align: center;
            }

            h4{
                line-height: 1.5em;
                text-align: center;
            }

            .btn{
                padding: 20px;
                font-size: 35px;
                background-color: white;
                border: 1px solid #1c1c1c;
                transition: 0.3s ease-in-out;
            }

            .btn:active{
                background-color: #e6e6e6;
                transition: 0.3s ease-in-out;
            }
            
            .dark{
                background-color: #1c1c1c;
                color: white;
                transition: 0.3s ease-in-out;
            }
            .dark-box{
                background-color: #1c1c1c;
                color: white;
                border: 1px solid white;
                transition: 0.3s ease-in-out;
            }
    
        </style>

    </head>

    <body>

        <section id="dark-container">

            <div id="toggle-container">
                <button id="toggle-button" class="btn">Theme Toggle</button>
            </div>

            <div class="text-container">
                <h1>Change at your PACE</h1>
                <br>
                <h4>Just change the theme at your pace. Just change the theme at your pace. Just change the theme at your pace. Just change the theme at your pace. Just change the theme at your pace.</h4>
            </div>

            <div class="saved-container">
                <h4>Saved Preferences : <span class="savedTheme-txt"></span></h4>
            </div>

        </section>
        <script src="dark.js"></script>
    </body>

</html>
